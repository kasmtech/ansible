---
- name: Check connection from web to postgres on db server
  ansible.builtin.wait_for:
    port: 5432
    host: "{{ install_common_db_host }}"
    timeout: 60

- name: Init remote Database
  ansible.builtin.expect:
    timeout: 600
    command: >
      bash {{ install_common_tempdir.path }}/kasm_release/install.sh
        --role init_remote_db
        --accept-eula
        --proxy-port {{ proxy_port }}
        --db-hostname {{ database_hostname }}
        --db-password {{ database_password }}
        --database-user {{ database_user }}
        --database-name {{ database_name }}
        --db-master-user {{ database_master_user }}
        --db-master-password {{ database_master_password }}
        --db-port {{ database_port }}
        --server-zone {{ zones[0] }}
        --manager-token {{ manager_token }}
        --registration-token {{ registration_token }}
        --user-password {{ user_password }}
        --admin-password {{ admin_password }}
        {{ '--no-db-ssl ' if not database_ssl }}
        {{ '--offline-service ' ~ install_common_service_images_copy.dest if install_common_service_images_file }}
    responses:
      Continue(?i): "y"
  run_once: true
  become: true
