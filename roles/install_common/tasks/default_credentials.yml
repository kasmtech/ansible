# Setup default creds if users don't set them in the inventory
#
# NOTE: These use lookup('password', '/dev/null ...') purely for random
# generation. Because the target is /dev/null, nothing is memoised -- each
# evaluation of this lookup produces a NEW random value. The 'when: ... is
# not defined' guard prevents re-generation within a single play, but if any
# of these facts is ever re-evaluated in a LATER, separate play (rather than
# being carried forward via hostvars/inventory), the new value will silently
# differ from what was actually installed. Not a vulnerability by itself,
# but a sharp edge worth keeping in mind when refactoring this role.
#

- set_fact:
    database_password: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=16') }}"
  when: database_password is not defined
  run_once: true
  delegate_to: localhost
  
- set_fact:
    user_password: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=16') }}"
  when: user_password is not defined
  run_once: true
  delegate_to: localhost

- set_fact:
    admin_password: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=16') }}"
  when: admin_password is not defined
  run_once: true
  delegate_to: localhost

- set_fact:
    manager_token: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=16') }}"
  when: manager_token is not defined
  run_once: true
  delegate_to: localhost

- set_fact:
    registration_token: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=22') }}"
  when: registration_token is not defined
  run_once: true
  delegate_to: localhost 
