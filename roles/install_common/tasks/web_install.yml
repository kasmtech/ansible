- name: Check connection from web to postgres on db server
  wait_for:
    port: 5432
    host: "{{ db_ip }}"
    timeout: 60

- name: Check connection from web to clickhouse on ch server
  wait_for:
    port: 9440
    host: "{{ ch_ip }}"
    timeout: 60

- name: Install web role
  command: >
    bash {{ tempdir.path }}/kasm_release/install.sh
      --role app
      --accept-eula
      --proxy-port {{ proxy_port }}
      --db-hostname {{ db_ip }}
      --db-password {{ database_password }}
      --api-hostname {{ target_ip }}
      --database-user {{ database_user }}
      --database-name {{ database_name }}
      --db-port {{ database_port }}
      --clickhouse-endpoint "tcp://{{ ch_ip }}:9440?secure=true&skip_verify=true"
      --clickhouse-http-endpoint "https://{{ ch_ip }}:8443"
      --clickhouse-username kasm_otel
      --clickhouse-password {{ ch_password }}
      --clickhouse-database kasm_otel
      --clickhouse-reader-password {{ ch_reader_password }}
      --otel-token {{ otel_token }}
      --otel-db-monitor-password {{ otel_db_monitor_password }}
      --server-zone {{ group_names[0] }}
      {{ '--no-db-ssl ' if not database_ssl }}
      {{ '--offline-service ' ~ service_images_copy.dest if service_images_file }}
      {{ '--offline-workspaces ' ~ workspace_images_copy.dest if workspace_images_file }}
  register: install_output
  no_log: true
  become: true
  no_log: true
  retries: 20
  delay: 10
  until: install_output is success or ('Failed to lock apt for exclusive operation' not in install_output.stderr and '/var/lib/dpkg/lock' not in install_output.stderr)
